{{- if and (.EFA) (.EFA.Enabled) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Driver.Name }}-efa
  namespace: {{ .Runtime.Namespace }}
  labels:
    app.kubernetes.io/component: efa-driver
    app.kubernetes.io/managed-by: gpu-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: efa-driver
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/component: efa-driver
    spec:
      hostNetwork: true
      priorityClassName: {{ default "system-node-critical" .Driver.Spec.PriorityClassName }}
      serviceAccountName: {{ .Driver.Name }}
      tolerations:
      - operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nodegroups.datadoghq.com/efa-enabled
                    operator: In
                    values:
                      - "true"
      initContainers:
      # InitContainer 1: EFA driver (precompiled)
      - name: efa-installer
        image: {{ .EFA.ImagePath }}
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
          privileged: true
        command:
          - "sleep"
          - "infinity"
        {{- if .Driver.Spec.Resources }}
        resources: {{ .Driver.Spec.Resources | yaml | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: lib-modules
          mountPath: /lib/modules
      # InitContainer 2: EFA NV Peermem driver (precompiled, separate image)
      {{- if and (.EFANVPeermem) (.EFANVPeermem.Enabled) }}
      - name: efa-nv-peermem-installer
        image: {{ .EFANVPeermem.ImagePath }}
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
          privileged: true
        command:
          - "sleep"
          - "infinity"
        {{- if .Driver.Spec.Resources }}
        resources: {{ .Driver.Spec.Resources | yaml | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: lib-modules
          mountPath: /lib/modules
      {{- end }}
      # InitContainer 3: RDMA Core installer
      {{- if .RDMACoreEnabled }}
      - name: rdma-core-installer
        # Image from EFA_INSTALLER_IMAGE env var (set by chart), falls back to EFA driver image
        image: {{ .EFA.InstallerImagePath }}
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
          privileged: true
        {{- if .Driver.Spec.Resources }}
        resources: {{ .Driver.Spec.Resources | yaml | nindent 10 }}
        {{- end }}
        command:
          - sleep
          - "infinity"
        # command:
        #   - bash
        #   - -c
        #   - |
        #     set -euo pipefail
        #     cp /mnt/scripts/* /host/usr/local/bin &&
        #     chroot /host /usr/local/bin/install-rdma-core.sh
        volumeMounts:
        - name: host-root
          mountPath: /host
        - name: scripts
          mountPath: /mnt/scripts
      {{- end }}
      containers:
      # Main container: AWS EFA Node Labeler
      - name: aws-efa-node-labeler
        # Image from EFA_INSTALLER_IMAGE env var (set by chart), falls back to EFA driver image
        image: {{ .EFA.InstallerImagePath }}
        imagePullPolicy: IfNotPresent
        command:
          - sleep
          - "infinity"
        # command:
        # - bash
        # - -c
        # - |
        #   set -euo pipefail
        #   trap "echo 'SIGTERM received, exiting'; exit" TERM
        #   echo "Labeling node $NODE_NAME with aws-efa-driver-ready=true"
        #   kubectl label node $NODE_NAME aws-efa-driver-ready=true --overwrite
        #   sleep infinity & wait $!
        {{- if .Driver.Spec.Resources }}
        resources: {{ .Driver.Spec.Resources | yaml | nindent 10 }}
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumes:
      - name: host-root
        hostPath:
          path: "/"
      - name: host-etc
        hostPath:
          path: /etc
      - name: lib-modules
        hostPath:
          path: /lib/modules
      - name: usr-src
        hostPath:
          path: /usr/src
      - name: scripts
        configMap:
          name: efa-installer-scripts
          items:
            - key: install-rdma-core.sh
              path: install-rdma-core.sh
              mode: 0755
{{- end }}
